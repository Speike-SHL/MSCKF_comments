     0,   1,   0,   0.000, 
     0,   0,   1,   0.000,
     0,   0,   0,   1.000]  # from Cam0 frame to Cam1 frame
  camera_model: pinhole
  distortion_coeffs: [-0.000254156616768871,  0.000223241023962626, -4.915493426699e-05, -3.63721490020648e-06]
  distortion_model: radtan
  intrinsics: [376.298310404567, 376.28429887456, 376.551294019449, 240.438650672553]
